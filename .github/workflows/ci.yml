name: Portable bridge
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nix-development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
        with:
          enable_kvm: false
          set_as_trusted_user: false
          install_url: https://releases.nixos.org/nix/nix-2.35.3/install
      - name: Check locked tools and installed distribution
        shell: bash
        run: |
          nix flake check --no-update-lock-file
          nix develop --no-update-lock-file --command bash scripts/check_nix_environment.sh
          git diff --exit-code -- flake.lock
      - name: Exercise reviewed direnv entry in disposable CI
        shell: bash
        env:
          DIRENV_CONFIG: ${{ runner.temp }}/bridge-direnv
        run: |
          mkdir -p "$DIRENV_CONFIG"
          # Trust is limited to this disposable runner, not any developer host.
          nix develop --no-update-lock-file --command direnv allow .
          nix develop --no-update-lock-file --command direnv exec . python -c 'import sys; assert sys.version_info[:2] == (3, 11)'
          git diff --exit-code -- flake.lock
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Test with restrictive permissions
        shell: bash
        run: |
          umask 077
          python scripts/test_clean_install.py
          python -m unittest discover -s tests -v
      - name: Build and inspect artifacts
        run: |
          python -m build --no-isolation
          python scripts/check_distribution.py dist
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python -m pip download -r requirements.lock --only-binary=:all: --dest "$RUNNER_TEMP/wheelhouse"
          python scripts/clean_install.py dist/*.whl --constraints requirements.lock --tests tests --wheelhouse "$RUNNER_TEMP/wheelhouse"
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan the exact source tree
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/release-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release-tree"
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --ignore-gitleaks-allow "$RUNNER_TEMP/release-tree"
